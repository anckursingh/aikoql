[package]
name = "mnemosyne-benchmarks"
description = "Mnemosyne benchmark harness — load tests and micro-benchmarks. Gates releases on published thresholds."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mnemosyne-kernel = { path = "../kernel" }
mnemosyne-vector = { path = "../engines/vector" }
mnemosyne-scheduler = { path = "../engines/scheduler" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hybrid_recall"
harness = false
