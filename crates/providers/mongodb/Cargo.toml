[package]
name = "mnemosyne-mongodb"
description = "MongoDB import connector — collection discovery, BSON-to-KO mapping, bulk import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mnemosyne-kernel = { path = "../../kernel" }
mongodb = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
