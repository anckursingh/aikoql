[package]
name = "mnemosyne-py"
description = "Python SDK for Mnemosyne Knowledge Kernel (PyO3) with LangGraph checkpointer spike"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_mnemosyne"
crate-type = ["cdylib"]

[dependencies]
mnemosyne-kernel = { path = "../../kernel" }
mnemosyne-graph = { path = "../../engines/graph" }
mnemosyne-compiler = { path = "../../compiler" }
mnemosyne-runtime = { path = "../../runtime" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[features]
default = []
