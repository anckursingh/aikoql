[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "aikoql"
# P3-M9 — the version comes from the Rust crate (version.workspace): one
# source of truth, sdk001 pins the parity.
dynamic = ["version"]
description = "Python SDK for the Aikoql Knowledge Kernel"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "python"
module-name = "aikoql._aikoql"
manifest-path = "Cargo.toml"
