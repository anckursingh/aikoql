[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mnemosyne"
version = "0.1.0"
description = "Python SDK for the Mnemosyne Knowledge Kernel"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "python"
module-name = "mnemosyne._mnemosyne"
manifest-path = "Cargo.toml"
