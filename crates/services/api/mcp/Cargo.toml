[package]
name = "aikoql-mcp"
description = "Aikoql MCP server: the Knowledge Syscall ABI (MRFC-0011 Class A) over Model Context Protocol stdio transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aikoql-kernel = { path = "../../../kernel" }
aikoql-storage-v2 = { path = "../../../storage/aikoql-v2" }
aikoql-graph = { path = "../../../engines/graph" }
aikoql-runtime = { path = "../../../runtime" }
aikoql-compiler = { path = "../../../compiler" }
aikoql-native = { path = "../../../protocol/native" }
aikoql-postgres = { path = "../../../providers/postgres" }
aikoql-sqlite = { path = "../../../providers/sqlite" }
aikoql-mongodb = { path = "../../../providers/mongodb" }
aikoql-neo4j = { path = "../../../providers/neo4j" }
aikoql-clickhouse = { path = "../../../providers/clickhouse" }
aikoql-ingestion = { path = "../../../ingestion" }
aikoql-semantic = { path = "../../../engines/semantic" }
aikoql-scheduler = { path = "../../../engines/scheduler" }
aikoql-vector = { path = "../../../engines/vector" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
# MRFC-0080 R5a-2: SigV4 for the S3 lease (already in the tree via sha2's family)
hmac = "0.12"
# R5a-2: the S3 lease's HTTP client (already in the default build's tree)
ureq = { version = "2", features = ["json"] }
# R5b-1: trust the cluster CA for the k8s lease (0.23 + ring are already in
# the tree; no default features, so aws-lc-rs stays out)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
# Ed25519 license verification (Task 2) — ring is already linked via
# rustls/kernel; this makes it a direct dependency for license.rs.
ring = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# AG-50: OTLP trace export when AIKOQL_OTEL_ENDPOINT is set (blocking HTTP
# client — the binary carries no async runtime)
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
# P3-M1 (§53): HTTP login credentials (argon2id, same crate/version the kernel
# KMS uses) + 256-bit CSPRNG session tokens. Both already in Cargo.lock.
argon2 = "0.5"
getrandom = "0.2"
# Enterprise multi-user store (Task 3): rusqlite at the locked version the
# aikoql-sqlite provider already builds (bundled SQLite) — zero new
# Cargo.lock entries.
rusqlite = { version = "0.31", features = ["bundled"] }
# AG-31 cloud KMS install: the AWS SDK implementation of the kernel's
# KmsOps seam (the serve binary supplies it; the kernel stays SDK-free).
aws-config = "1"
# the SDK's default "rustls" feature is the legacy stack (hyper 0.14,
# h2 0.3, rustls 0.21, webpki 0.101) — RustSec 2026-0258/0346/0349/
# 0104/0382/0099/0098 have no patch in those lines. Take the modern
# default-https-client (hyper 1, rustls 0.23) and leave the legacy off.
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# The SDK bridge's current-thread runtime (the binary carries no other
# async runtime — see the OTLP comment below).
tokio = { version = "1", features = ["rt", "time"] }

[features]
default = ["embedding-candle"]
embedding-candle = ["aikoql-semantic/embedding-candle"]
embedding-openai = ["aikoql-semantic/embedding-openai"]

[dev-dependencies]
# Live-connector certification (MVP-QA-001 Suite D/E): tests seed/update rows
# through the same drivers the providers use, then assert via the kernel crate
# directly (aikoql-mcp is a binary crate — no lib API to read state back).
aikoql-kernel = { path = "../../../kernel" }
aikoql-storage-v2 = { path = "../../../storage/aikoql-v2" }
postgres = "0.19"
mongodb = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
# AG-50: decode the OTLP/HTTP export the observability e2e test receives
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
