[package]
name = "aikoql-runtime"
description = "Aikoql Runtime: physical-plan interpreter for Knowledge IR. Executes IR plans against the Knowledge Kernel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aikoql-kernel = { path = "../kernel" }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
aikoql-semantic = { path = "../engines/semantic" }
aikoql-compiler = { path = "../compiler" }
aikoql-graph = { path = "../engines/graph" }
