[package]
name = "aikoql-ingestion"
description = "Aikoql Document Ingestion Plugin SDK — extension point for PDF/OCR/etc."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aikoql-kernel = { path = "../kernel" }
pdf-extract = "0.9"
zip = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits", "printing"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ingest_benchmark"
harness = false
