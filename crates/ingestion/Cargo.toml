[package]
name = "aikoql-ingestion"
description = "Aikoql Document Ingestion Plugin SDK — extension point for PDF/OCR/etc."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aikoql-kernel = { path = "../kernel" }
pdf-extract = "0.9"
# PR-F: embedded-image extraction. Already in the lockfile through pdf-extract
# (0.36.0) — this only promotes it to a direct dependency, no graph change.
lopdf = "0.36"
zip = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits", "printing"] }
quote = "1"
proc-macro2 = "1"
# PR-F feature "vlm": OpenAI-compatible vision calls. Optional — never in the
# default build (HLD §33: no mandatory VLM).
ureq = { version = "3", features = ["json"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# FlateDecode PDF fixtures in tests. Already in the lockfile via lopdf.
flate2 = "1"

[features]
# PR-F DoD row 14: optional VLM analyzer set (ureq, env-configured).
# NOT in the default build — self-hosted AIKOQL must not require a VLM
# (HLD §33: "Do not invoke a VLM for every image").
vlm = ["dep:ureq"]

[[bench]]
name = "ingest_benchmark"
harness = false
