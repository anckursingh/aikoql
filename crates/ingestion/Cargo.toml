[package]
name = "mnemosyne-ingestion"
description = "Mnemosyne Document Ingestion Plugin SDK — extension point for PDF/OCR/etc."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mnemosyne-kernel = { path = "../kernel" }
pdf-extract = "0.9"
zip = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
