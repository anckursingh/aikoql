[package]
name = "aikoql-kernel"
description = "Aikoql Knowledge Kernel: KOM (MRFC-0001), commit pipeline, KS-ABI Class A syscalls (MRFC-0011). std-only, deterministic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
redb = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
regex = "1"

[dev-dependencies]
aikoql-vector = { path = "../engines/vector" }
aikoql-scheduler = { path = "../engines/scheduler" }
aikoql-graph = { path = "../engines/graph" }
aikoql-compiler = { path = "../compiler" }
aikoql-runtime = { path = "../runtime" }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "kom_benchmark"
harness = false
