# aikoql — leader + standby on the k8s lease (AG-51).
#
# Two replicas of the same binary: whoever holds the lease (k8s://<ns>/<leaseName>)
# serves writes, the other follows the holder's replication stream and serves
# reads. Replication between pods is TLS (the plaintext listener is loopback-only
# by policy); the pre-install hook generates a shared CA + serving cert unless
# tls.auto is false.

image:
  repository: aikoql
  tag: "0.3.0"
  pullPolicy: IfNotPresent

# the bearer for /mcp AND the standby's replication token (admin role).
# Required: the token must come from a Secret, never from values.
auth:
  existingSecret: aikoql-auth
  tokenKey: token
  # optional: arms the OAuth surface (RFC 9728) when this key holds the
  # admin bootstrap password (AIKOQL_ADMIN_PASSWORD)
  adminPasswordKey: ""

# metrics + Streamable HTTP MCP share one surface
mcpPort: 4318
replPort: 7071

# k8s://<namespace>/<leaseName>
leaseName: primary

tls:
  # helm renders a CA + serving cert for the pod DNS names into
  # <fullname>-repl-tls (reused across upgrades); false = bring-your-own
  # Secret of the same name with keys ca.crt, tls.crt (chain), tls.key
  auto: true

storage:
  size: 5Gi
  # "" = the cluster default StorageClass
  storageClass: ""

resources: {}
nodeSelector: {}
tolerations: []
