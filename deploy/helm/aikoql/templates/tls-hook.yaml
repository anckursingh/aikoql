{{- if .Values.tls.auto }}
# Pre-install Job: generate the replication CA + one serving cert whose
# SANs cover both pods' DNS names (shared serving cert — per-pod certs
# are a cert-manager upgrade; see the README). Stored in
# <fullname>-repl-tls: ca.crt, tls.crt (server chain), tls.key.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aikoql.fullname" . }}-tls-gen
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "aikoql.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "aikoql.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "aikoql.fullname" . }}
      containers:
        - name: gen
          image: {{ .Values.tls.hookImage }}
          command:
            - sh
            - -ec
            - |
              set -e
              SAN1="*.${SVC}.${NS}.svc"
              SAN2="*.${SVC}.${NS}.svc.cluster.local"
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -keyout ca.key -out ca.crt -subj "/CN=aikoql-repl-ca"
              openssl req -newkey rsa:2048 -nodes -keyout tls.key \
                -out server.csr -subj "/CN=aikoql-repl"
              printf 'subjectAltName=DNS:%s,DNS:%s\n' "$SAN1" "$SAN2" > san.cnf
              openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
                -CAcreateserial -days 3650 -extfile san.cnf -out server.crt
              cat server.crt ca.crt > chain.crt
              kubectl create secret generic "${SECRET}" --dry-run=client -o yaml \
                --from-file=ca.crt=ca.crt --from-file=tls.crt=chain.crt \
                --from-file=tls.key=tls.key | kubectl apply -f -
          env:
            - name: NS
              value: {{ .Release.Namespace }}
            - name: SVC
              value: {{ include "aikoql.fullname" . }}-headless
            - name: SECRET
              value: {{ include "aikoql.fullname" . }}-repl-tls
{{- end }}
