# R5a: the server needs get/create/update on the lease it contends for —
# and nothing else. The repl-tls Secret is rendered by helm, so no pod
# writes Secrets — a kubectl-in-a-pod hook needs verbs (and images)
# nothing else in the chart uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aikoql.fullname" . }}
  labels:
    {{- include "aikoql.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aikoql.fullname" . }}
  labels:
    {{- include "aikoql.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aikoql.fullname" . }}
  labels:
    {{- include "aikoql.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aikoql.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aikoql.fullname" . }}
