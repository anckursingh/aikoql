# L-23 (TDD-034): strong-claims evidence registry. Every strong claim in
# the audited scope (the launch's storage estate: crates/storage/aikoql-v2 +
# crates/kernel) — complexity (O(...)), boundedness, exactly-once delivery,
# zero allocation — maps to an evidence test that EXISTS, or the claim loses
# its claim (the prose softened, its row removed). check-strong-claims.sh
# sweeps the estate's comment lines for the claim vocabulary; every hit must
# be pinned here by its (file,line) pair, and every evidence must be a live
# `fn <name>(` in the tree. Rows are data, never prose guarantees: keep the
# text verbatim from the pinned line, and only cite tests that actually pin
# the claim.

