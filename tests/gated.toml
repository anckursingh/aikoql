# PR6-F2 (P0-2): gated-cell registry — the cells the per-push CI test
# commands skip, centralized (docs/ARCHITECT-REVIEW-2026-09.md).
#
# scripts/skip-list.sh derives the ci.yml --skip args from this file (the
# ONLY skip source in the workflow); scripts/check-skip-drift.sh asserts
# that wiring and that every registered name still exists in the tree (a
# renamed test silently un-skips itself on CI). The ungated home column
# says where each cell re-runs with its gate armed — the benchmark-nightly
# "Gated cells ungated" job runs every `none` entry weekly so the limits
# can't silently regress.
#
# verified_at = the head each entry's gate condition was last re-verified at.

[[gated]]
test = "load_encryption_overhead"
reason = "pure measurement cell; #[ignore] in debug — weekly --ignored release step covers it"
ungated_by = "weekly --ignored step"
verified_at = "8c60d74"

