[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aikoql-training"
version = "0.1.0"
description = "Training Data Engine for AikoQL — deterministic, validated training/evaluation dataset generation"
requires-python = ">=3.9"
dependencies = []
# The aikoql SDK dependency lands at T-02 (snapshot adapter) — T-01 models
# are stdlib-only.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
