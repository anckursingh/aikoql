[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aikoql-training"
version = "0.1.0"
description = "Training Data Engine for AikoQL — deterministic, validated training/evaluation dataset generation"
requires-python = ">=3.9"
dependencies = ["aikoql>=0.2.1"]  # T-02: the installed SDK is the only AIKOQL boundary

[project.scripts]
aikoql-training = "aikoql_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
