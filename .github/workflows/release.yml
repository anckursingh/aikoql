name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # npm-only rescue: publishes npm-publish/package.json's version via npm trusted publishing (all tag jobs skipped)

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Version gate: git tag is the single source of truth ─────────
  validate-versions:
    name: Validate versions vs tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo / npm / plugin versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          npm_ver="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' npm-publish/package.json | head -1)"
          plugin_ver="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .claude-plugin/plugin.json | head -1)"
          fail=0
          [ "$tag" = "$cargo_ver" ] || { echo "::error::Cargo.toml version '$cargo_ver' != tag '$tag'"; fail=1; }
          [ "$tag" = "$npm_ver" ] || { echo "::error::npm version '$npm_ver' != tag '$tag'"; fail=1; }
          [ "$tag" = "$plugin_ver" ] || { echo "::error::plugin version '$plugin_ver' != tag '$tag'"; fail=1; }
          grep -q "releases/download/v$tag/" website/index.html || { echo "::error::website/index.html not pinned to v$tag"; fail=1; }
          grep -q "releases/download/v$tag/" website/docs/getting-started.md || { echo "::error::getting-started.md not pinned to v$tag"; fail=1; }
          exit $fail

  # ── Windows binary ──────────────────────────────────────────────
  windows:
    name: Build Windows (x86_64)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release -p aikoql-mcp
      - name: Smoke test binary (version + MCP initialize + tools/list + tools/call)
        run: |
          .\target\release\aikoql-mcp.exe --version
          node npm-publish/smoke-mcp.js .\target\release\aikoql-mcp.exe
      - name: Generate SHA-256
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target/release/aikoql-mcp.exe).Hash.ToLower()
          "$hash  aikoql-mcp.exe" | Out-File -Encoding ASCII target/release/aikoql-mcp.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/aikoql-mcp.exe
            target/release/aikoql-mcp.exe.sha256

  # ── Linux glibc binary ──────────────────────────────────────────
  linux-gnu:
    name: Build Linux (x86_64-gnu)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release -p aikoql-mcp
      - name: Smoke test binary (version + MCP initialize + tools/list + tools/call)
        run: |
          target/release/aikoql-mcp --version
          node npm-publish/smoke-mcp.js target/release/aikoql-mcp
      - name: Generate SHA-256
        run: |
          sha256sum target/release/aikoql-mcp | cut -d' ' -f1 > target/release/aikoql-mcp-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnu
          path: |
            target/release/aikoql-mcp
            target/release/aikoql-mcp-linux.sha256

  # ── Linux musl binary ───────────────────────────────────────────
  # hf-hub is pinned rustls-only (aikoql-semantic), so no openssl-sys enters
  # the tree and the cross image builds it as-is.
  linux-musl:
    name: Build Linux (x86_64-musl)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build release (musl)
        run: cross build --release --target x86_64-unknown-linux-musl -p aikoql-mcp
      - name: Generate SHA-256
        run: |
          sha256sum target/x86_64-unknown-linux-musl/release/aikoql-mcp | cut -d' ' -f1 \
            > target/x86_64-unknown-linux-musl/release/aikoql-mcp-linux-musl.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/aikoql-mcp
            target/x86_64-unknown-linux-musl/release/aikoql-mcp-linux-musl.sha256

  # ── macOS Intel binary ──────────────────────────────────────────
  # macos-13 hosted runners are retired (jobs queue forever), so build
  # x86_64-apple-darwin on the arm64 runner via cross-compilation.
  macos-intel:
    name: Build macOS (x86_64)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build release (x86_64)
        run: cargo build --release --target x86_64-apple-darwin -p aikoql-mcp
      - name: Generate SHA-256
        run: |
          shasum -a 256 target/x86_64-apple-darwin/release/aikoql-mcp | cut -d' ' -f1 \
            > target/x86_64-apple-darwin/release/aikoql-mcp-macos.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: |
            target/x86_64-apple-darwin/release/aikoql-mcp
            target/x86_64-apple-darwin/release/aikoql-mcp-macos.sha256

  # ── macOS Apple Silicon binary ──────────────────────────────────
  macos-arm:
    name: Build macOS (aarch64)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release -p aikoql-mcp
      - name: Smoke test binary (version + MCP initialize + tools/list + tools/call)
        run: |
          target/release/aikoql-mcp --version
          node npm-publish/smoke-mcp.js target/release/aikoql-mcp
      - name: Generate SHA-256
        run: |
          shasum -a 256 target/release/aikoql-mcp | cut -d' ' -f1 \
            > target/release/aikoql-mcp-macos-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            target/release/aikoql-mcp
            target/release/aikoql-mcp-macos-arm64.sha256

  # ── Docker: one native build per architecture (no qemu emulation) ─
  # Each job pushes an arch-suffixed tag; docker-manifest merges them into
  # the canonical :VERSION / :MINOR / :latest tags. OCI labels carry
  # version/source/revision so `docker inspect` identifies the exact commit.
  docker-amd64:
    name: Docker image (linux/amd64)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags + labels
        id: tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/anckursingh/aikoql:${{ steps.tag.outputs.version }}-amd64
          labels: |
            org.opencontainers.image.title=aikoql
            org.opencontainers.image.description=Knowledge database with built-in encryption and an MCP interface
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/anckursingh/aikoql
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
      - name: Smoke test container (health + version)
        run: |
          set -euo pipefail
          v="${{ steps.tag.outputs.version }}"
          docker run -d --name aikoql-smoke \
            -e AIKOQL_TCP_TOKEN=smoketoken:acme:admin \
            -p 19090:9090 -p 19091:9091 \
            ghcr.io/anckursingh/aikoql:${v}-amd64
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19091/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs aikoql-smoke; exit 1; }
          docker run --rm --entrypoint aikoql ghcr.io/anckursingh/aikoql:${v}-amd64 --version
          docker rm -f aikoql-smoke

  docker-arm64:
    name: Docker image (linux/arm64)
    if: github.event_name == 'push'
    needs: validate-versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags + labels
        id: tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anckursingh/aikoql:${{ steps.tag.outputs.version }}-arm64
          labels: |
            org.opencontainers.image.title=aikoql
            org.opencontainers.image.description=Knowledge database with built-in encryption and an MCP interface
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/anckursingh/aikoql
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
      - name: Smoke test binary (version)
        run: |
          docker run --rm --entrypoint aikoql \
            ghcr.io/anckursingh/aikoql:${{ steps.tag.outputs.version }}-arm64 --version

  # ── Docker manifest: merge arch images into canonical tags, print digest ──
  docker-manifest:
    name: Publish multi-arch image
    if: github.event_name == 'push'
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge manifests, tag, print digest
        run: |
          v="${GITHUB_REF_NAME#v}"
          minor="$(echo "$v" | sed 's/\.[0-9]*$//')"
          docker buildx imagetools create \
            -t ghcr.io/anckursingh/aikoql:${v} \
            -t ghcr.io/anckursingh/aikoql:${minor} \
            -t ghcr.io/anckursingh/aikoql:latest \
            ghcr.io/anckursingh/aikoql:${v}-amd64 \
            ghcr.io/anckursingh/aikoql:${v}-arm64
          echo "::notice::pushed ghcr.io/anckursingh/aikoql:${v} (:${minor}, :latest)"
          docker buildx imagetools inspect ghcr.io/anckursingh/aikoql:${v}

  # ── GitHub Release ──────────────────────────────────────────────
  github-release:
    name: Publish Release
    if: github.event_name == 'push'
    needs: [validate-versions, windows, linux-gnu, linux-musl, macos-intel, macos-arm, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '!*.dockerbuild'  # skip buildx state artifacts (build-push-action uploads corrupt blobs; they broke this job on v0.1.18)
      - name: Rename + collect
        run: |
          cp windows/aikoql-mcp.exe           aikoql-mcp.exe
          cp windows/aikoql-mcp.exe.sha256    aikoql-mcp.exe.sha256
          cp linux-gnu/aikoql-mcp             aikoql-mcp-linux
          cp linux-gnu/aikoql-mcp-linux.sha256 aikoql-mcp-linux.sha256
          cp linux-musl/aikoql-mcp             aikoql-mcp-linux-musl
          cp linux-musl/aikoql-mcp-linux-musl.sha256 aikoql-mcp-linux-musl.sha256
          cp macos-intel/aikoql-mcp            aikoql-mcp-macos
          cp macos-intel/aikoql-mcp-macos.sha256 aikoql-mcp-macos.sha256
          cp macos-arm/aikoql-mcp              aikoql-mcp-macos-arm64
          cp macos-arm/aikoql-mcp-macos-arm64.sha256 aikoql-mcp-macos-arm64.sha256
      - name: Checksums file
        run: |
          cat aikoql-mcp-*.sha256 > checksums.txt
          sha256sum checksums.txt > checksums.txt.sha256
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aikoql-mcp.exe
            aikoql-mcp.exe.sha256
            aikoql-mcp-linux
            aikoql-mcp-linux.sha256
            aikoql-mcp-linux-musl
            aikoql-mcp-linux-musl.sha256
            aikoql-mcp-macos
            aikoql-mcp-macos.sha256
            aikoql-mcp-macos-arm64
            aikoql-mcp-macos-arm64.sha256
            checksums.txt
            checksums.txt.sha256
          generate_release_notes: true

  # ── npm publish, gated on the release + version match ──────────
  # Publishes via npm trusted publishing (GitHub Actions OIDC, no token).
  # Also runs standalone on workflow_dispatch (rescue path: publishes the
  # version in npm-publish/package.json, e.g. v0.1.18's gap).
  npm-publish:
    name: Publish npm package
    if: ${{ github.event_name == 'workflow_dispatch' || (always() && github.event_name == 'push' && needs.github-release.result == 'success') }}
    needs: [github-release, validate-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Pack + install the exact tarball + MCP smoke
        working-directory: npm-publish
        run: |
          set -euo pipefail
          mkdir -p /tmp/aikoql-pkg  # npm pack does not create the --pack-destination dir (v0.1.18 npm job failed on ENOENT)
          npm pack --pack-destination /tmp/aikoql-pkg
          tarball=$(ls /tmp/aikoql-pkg/aikoql-mcp-*.tgz | head -1)
          clean=$(mktemp -d)
          npm install --prefix "$clean" "$tarball" >/dev/null
          cd "$clean"
          npx aikoql-mcp --version
          node "$OLDPWD/smoke-mcp.js" npx aikoql-mcp serve "$clean/db"
      - name: Publish
        working-directory: npm-publish
        run: npm publish --provenance
