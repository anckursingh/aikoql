name: Release

on:
  push:
    tags: ['v*']
  # Button path (option A): the dispatch run materializes the tag itself and
  # then continues into the normal pipeline (a GITHUB_TOKEN tag push does not
  # re-trigger workflows). Re-dispatch with an existing tag skips the tag step
  # and degenerates into the old npm-only rescue.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.20). Empty = use the Cargo.toml version.'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

# CodeQL actions/missing-workflow-permissions: build jobs only read the repo;
# jobs that write (github-release, docker-*, npm-publish) declare their own
# job-level permissions blocks below.
permissions:
  contents: read

jobs:
  # ── Version gate: git tag is the single source of truth ─────────
  validate-versions:
    name: Validate versions vs tag
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo / npm / plugin versions match tag
        id: gate
        run: |
          if [ "${{ github.event_name }}" = 'push' ]; then
            tag="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          else
            tag="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          cargo_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          npm_ver="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' npm-publish/package.json | head -1)"
          plugin_ver="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .claude-plugin/plugin.json | head -1)"
          # Python is version.workspace = true — resolve through cargo so the
          # gate reads the RESOLVED version, not the literal (PR6-009: every
          # release channel asserts against the tag).
          py_ver="$(cargo pkgid -p aikoql-py | sed 's/.*@//')"
          fail=0
          [ "$tag" = "$cargo_ver" ] || { echo "::error::Cargo.toml version '$cargo_ver' != tag '$tag'"; fail=1; }
          [ "$tag" = "$npm_ver" ] || { echo "::error::npm version '$npm_ver' != tag '$tag'"; fail=1; }
          [ "$tag" = "$plugin_ver" ] || { echo "::error::plugin version '$plugin_ver' != tag '$tag'"; fail=1; }
          [ "$tag" = "$py_ver" ] || { echo "::error::Python SDK version '$py_ver' != tag '$tag'"; fail=1; }
          grep -q "releases/download/v$tag/" website/index.html || { echo "::error::website/index.html not pinned to v$tag"; fail=1; }
          grep -q "releases/download/v$tag/" website/docs/getting-started.md || { echo "::error::getting-started.md not pinned to v$tag"; fail=1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          exit $fail

  # ── Button path: materialize the tag, then the normal jobs run ──
  # Runs only on workflow_dispatch; the tag push below cannot re-trigger this
  # workflow (GITHUB_TOKEN rule), so the dispatch run itself continues through
  # the build → release → npm pipeline. A re-dispatch with the tag already
  # present skips gracefully — that degrades into the npm-only rescue.
  create-tag:
    name: Create release tag
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.validate-versions.result == 'success' }}
    needs: validate-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push tag v${{ needs.validate-versions.outputs.version }}
        env:
          TAG: v${{ needs.validate-versions.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG already exists — skipping (rescue re-dispatch)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "::notice::pushed tag $TAG"

  # ── CI-09: Tier-3 launch certification (TESTING-PLAN §6) ──────────
  # The release evidence pack that ships with the tag: the full
  # correctness suite (incl. the concurrency/recovery cells — the suite IS
  # their carrier) on Linux + Windows, the coverage floor, the full-scale
  # benchmark harness (100k + 1M + MCP column + multi-op txn), and the
  # competitor matrix with its §13/§18 schema-checked report trio (the
  # benchmark report artifact). Every leg reuses the ci.yml/benchmark.yml
  # invocation verbatim — a release measures exactly what CI measures,
  # gated cells and pinned images included.
  tier3-correctness:
    name: Tier-3 correctness (Linux)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job.
      - uses: Swatinem/rust-cache@v2
      # The CI invocation verbatim — the skip list gates measurement-only
      # cells (SE-06), never correctness (same as ci.yml's test-linux).
      - run: cargo test --workspace -- $(bash scripts/skip-list.sh)
        shell: bash
        timeout-minutes: 180

  tier3-correctness-windows:
    name: Tier-3 correctness (Windows)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job.
      - uses: Swatinem/rust-cache@v2
      # bash, not pwsh: the $(...) here is bash word-splitting (the
      # CI-rounds-2-3 lesson, same as ci.yml's Windows test job).
      - run: cargo test --workspace -- $(bash scripts/skip-list.sh)
        shell: bash
        timeout-minutes: 180

  tier3-coverage:
    name: Tier-3 coverage floor
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # CI-05: cargo cache in every build job.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage floor check
        shell: bash
        run: bash scripts/check-coverage-floor.sh

  tier3-scale:
    name: Tier-3 scale certification (100k + 1M)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      pg:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release aikoql-mcp + native SDK
        run: |
          set -euo pipefail
          cargo build --release -p aikoql-mcp
          python -m venv .venv
          .venv/bin/pip install -q maturin psutil psycopg neo4j qdrant-client
          export VIRTUAL_ENV="$PWD/.venv"
          cd crates/sdk/python
          "$VIRTUAL_ENV/bin/maturin" develop --release
          cd "$GITHUB_WORKSPACE"
      - name: Run the full scale harness (100k + 1M + MCP + txn)
        run: |
          set -euo pipefail
          .venv/bin/python scripts/competitor_bench/scale.py \
            --out "$RUNNER_TEMP/scale-result.json"
          cp "$RUNNER_TEMP/scale-result.json" scale-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: tier3-scale-result
          path: scale-result.json
          if-no-files-found: error

  tier3-matrix:
    name: Tier-3 competitor matrix + report artifact
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/benchmarkpass
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-check-certificate -qO- http://localhost:7474 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        # CI-08 (§18): pinned competitor version — explicit tags only, the
        # digest the run measured lands in result.json's engine_versions.
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 2)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release SDK (maturin develop)
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -q maturin psutil psycopg neo4j qdrant-client pymongo
          export VIRTUAL_ENV="$PWD/.venv"
          cd crates/sdk/python
          "$VIRTUAL_ENV/bin/maturin" develop --release
          cd "$GITHUB_WORKSPACE"
      - name: Run the competitor matrix (hybrid knowledge cell)
        run: .venv/bin/python scripts/competitor_bench/bench.py
      # CI-08 (§13/§18/§14): the release artifact must satisfy the same
      # schema contract the laptop evidence does.
      - name: Schema-validate the competitor artifact
        run: .venv/bin/python scripts/artifact_schema.py docs/certification/competitors/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: tier3-competitor-matrix
          path: |
            docs/certification/competitors/result.json
            docs/certification/competitors/result.csv
          if-no-files-found: error

  # ── Windows binary ──────────────────────────────────────────────
  windows:
    name: Build Windows (x86_64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p aikoql-mcp
      - name: Smoke test binary (version + MCP initialize + tools/list + tools/call)
        run: |
          .\target\release\aikoql-mcp.exe --version
          node npm-publish/smoke-mcp.js .\target\release\aikoql-mcp.exe
      - name: Generate SHA-256
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target/release/aikoql-mcp.exe).Hash.ToLower()
          "$hash  aikoql-mcp.exe" | Out-File -Encoding ASCII target/release/aikoql-mcp.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/aikoql-mcp.exe
            target/release/aikoql-mcp.exe.sha256

  # ── Linux glibc binary ──────────────────────────────────────────
  linux-gnu:
    name: Build Linux (x86_64-gnu)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p aikoql-mcp
      - name: Smoke test binary (version + MCP initialize + tools/list + tools/call)
        run: |
          target/release/aikoql-mcp --version
          node npm-publish/smoke-mcp.js target/release/aikoql-mcp
      - name: Generate SHA-256
        run: |
          sha256sum target/release/aikoql-mcp | cut -d' ' -f1 > target/release/aikoql-mcp-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnu
          path: |
            target/release/aikoql-mcp
            target/release/aikoql-mcp-linux.sha256

  # ── Linux musl binary ───────────────────────────────────────────
  # hf-hub is pinned rustls-only (aikoql-semantic), so no openssl-sys enters
  # the tree and the cross image builds it as-is.
  linux-musl:
    name: Build Linux (x86_64-musl)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build release (musl)
        run: cross build --release --target x86_64-unknown-linux-musl -p aikoql-mcp
      - name: Generate SHA-256
        run: |
          sha256sum target/x86_64-unknown-linux-musl/release/aikoql-mcp | cut -d' ' -f1 \
            > target/x86_64-unknown-linux-musl/release/aikoql-mcp-linux-musl.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/aikoql-mcp
            target/x86_64-unknown-linux-musl/release/aikoql-mcp-linux-musl.sha256

  # ── macOS Intel binary ──────────────────────────────────────────
  # macos-13 hosted runners are retired (jobs queue forever), so build
  # x86_64-apple-darwin on the arm64 runner via cross-compilation.
  macos-intel:
    name: Build macOS (x86_64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - name: Build release (x86_64)
        run: cargo build --release --target x86_64-apple-darwin -p aikoql-mcp
      - name: Generate SHA-256
        run: |
          shasum -a 256 target/x86_64-apple-darwin/release/aikoql-mcp | cut -d' ' -f1 \
            > target/x86_64-apple-darwin/release/aikoql-mcp-macos.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: |
            target/x86_64-apple-darwin/release/aikoql-mcp
            target/x86_64-apple-darwin/release/aikoql-mcp-macos.sha256

  # ── macOS Apple Silicon binary ──────────────────────────────────
  macos-arm:
    name: Build macOS (aarch64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p aikoql-mcp
      - name: Smoke test binary (version + MCP initialize + tools/list + tools/call)
        run: |
          target/release/aikoql-mcp --version
          node npm-publish/smoke-mcp.js target/release/aikoql-mcp
      - name: Generate SHA-256
        run: |
          shasum -a 256 target/release/aikoql-mcp | cut -d' ' -f1 \
            > target/release/aikoql-mcp-macos-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            target/release/aikoql-mcp
            target/release/aikoql-mcp-macos-arm64.sha256

  # ── Docker: one native build per architecture (no qemu emulation) ─
  # Each job pushes an arch-suffixed tag; docker-manifest merges them into
  # the canonical :VERSION / :MINOR / :latest tags. OCI labels carry
  # version/source/revision so `docker inspect` identifies the exact commit.
  docker-amd64:
    name: Docker image (linux/amd64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags + labels
        id: tag
        run: |
          v="${{ needs.validate-versions.outputs.version }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/anckursingh/aikoql:${{ steps.tag.outputs.version }}-amd64
          labels: |
            org.opencontainers.image.title=aikoql
            org.opencontainers.image.description=Knowledge database with built-in encryption and an MCP interface
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/anckursingh/aikoql
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
      - name: Smoke test container (health + version)
        run: |
          set -euo pipefail
          v="${{ steps.tag.outputs.version }}"
          # R1/R3 (review round 3): the container binds loopback-only, so
          # `-p` port publishing would DNAT onto container eth0 and never
          # reach 127.0.0.1 — probe health from INSIDE the container.
          docker run -d --name aikoql-smoke \
            -e AIKOQL_TCP_TOKEN=smoketoken:acme:admin \
            ghcr.io/anckursingh/aikoql:${v}-amd64
          ok=""
          for i in $(seq 1 30); do
            if docker exec aikoql-smoke curl -fsS http://127.0.0.1:9091/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs aikoql-smoke; exit 1; }
          docker run --rm --entrypoint aikoql ghcr.io/anckursingh/aikoql:${v}-amd64 --version
          docker rm -f aikoql-smoke

  docker-arm64:
    name: Docker image (linux/arm64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags + labels
        id: tag
        run: |
          v="${{ needs.validate-versions.outputs.version }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anckursingh/aikoql:${{ steps.tag.outputs.version }}-arm64
          labels: |
            org.opencontainers.image.title=aikoql
            org.opencontainers.image.description=Knowledge database with built-in encryption and an MCP interface
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/anckursingh/aikoql
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
      - name: Smoke test binary (version)
        run: |
          docker run --rm --entrypoint aikoql \
            ghcr.io/anckursingh/aikoql:${{ steps.tag.outputs.version }}-arm64 --version

  # ── Docker manifest: merge arch images into canonical tags, print digest ──
  docker-manifest:
    name: Publish multi-arch image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate-versions, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge manifests, tag, print digest
        run: |
          v="${{ needs.validate-versions.outputs.version }}"
          minor="$(echo "$v" | sed 's/\.[0-9]*$//')"
          docker buildx imagetools create \
            -t ghcr.io/anckursingh/aikoql:${v} \
            -t ghcr.io/anckursingh/aikoql:${minor} \
            -t ghcr.io/anckursingh/aikoql:latest \
            ghcr.io/anckursingh/aikoql:${v}-amd64 \
            ghcr.io/anckursingh/aikoql:${v}-arm64
          echo "::notice::pushed ghcr.io/anckursingh/aikoql:${v} (:${minor}, :latest)"
          docker buildx imagetools inspect ghcr.io/anckursingh/aikoql:${v}

  # ── GitHub Release ──────────────────────────────────────────────
  github-release:
    name: Publish Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate-versions, windows, linux-gnu, linux-musl, macos-intel, macos-arm, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '!*.dockerbuild'  # skip buildx state artifacts (build-push-action uploads corrupt blobs; they broke this job on v0.1.18)
      - name: Rename + collect
        run: |
          cp windows/aikoql-mcp.exe           aikoql-mcp.exe
          cp windows/aikoql-mcp.exe.sha256    aikoql-mcp.exe.sha256
          cp linux-gnu/aikoql-mcp             aikoql-mcp-linux
          cp linux-gnu/aikoql-mcp-linux.sha256 aikoql-mcp-linux.sha256
          cp linux-musl/aikoql-mcp             aikoql-mcp-linux-musl
          cp linux-musl/aikoql-mcp-linux-musl.sha256 aikoql-mcp-linux-musl.sha256
          cp macos-intel/aikoql-mcp            aikoql-mcp-macos
          cp macos-intel/aikoql-mcp-macos.sha256 aikoql-mcp-macos.sha256
          cp macos-arm/aikoql-mcp              aikoql-mcp-macos-arm64
          cp macos-arm/aikoql-mcp-macos-arm64.sha256 aikoql-mcp-macos-arm64.sha256
      - name: Checksums file
        run: |
          cat aikoql-mcp-*.sha256 > checksums.txt
          sha256sum checksums.txt > checksums.txt.sha256
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate-versions.outputs.version }}
          files: |
            aikoql-mcp.exe
            aikoql-mcp.exe.sha256
            aikoql-mcp-linux
            aikoql-mcp-linux.sha256
            aikoql-mcp-linux-musl
            aikoql-mcp-linux-musl.sha256
            aikoql-mcp-macos
            aikoql-mcp-macos.sha256
            aikoql-mcp-macos-arm64
            aikoql-mcp-macos-arm64.sha256
            checksums.txt
            checksums.txt.sha256
          generate_release_notes: true

  # ── npm publish, gated on the release + version match ──────────
  # Publishes via npm trusted publishing (GitHub Actions OIDC, no token).
  # Also runs standalone on workflow_dispatch (rescue path: publishes the
  # version in npm-publish/package.json, e.g. v0.1.18's gap).
  npm-publish:
    name: Publish npm package
    if: ${{ github.event_name == 'workflow_dispatch' || (always() && github.event_name == 'push' && needs.github-release.result == 'success') }}
    needs: [github-release, validate-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack + install the exact tarball + MCP smoke
        working-directory: npm-publish
        run: |
          set -euo pipefail
          mkdir -p /tmp/aikoql-pkg  # npm pack does not create the --pack-destination dir (v0.1.18 npm job failed on ENOENT)
          npm pack --pack-destination /tmp/aikoql-pkg
          tarball=$(ls /tmp/aikoql-pkg/aikoql-mcp-*.tgz | head -1)
          clean=$(mktemp -d)
          npm install --prefix "$clean" "$tarball" >/dev/null
          cd "$clean"
          npx aikoql-mcp --version
          node "$OLDPWD/smoke-mcp.js" npx aikoql-mcp serve "$clean/db"
      - name: Publish
        working-directory: npm-publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ''  # force pure OIDC — GitHub injects a managed token that npmjs.org 404s (v0.1.18)

  # ── PyPI publish (P3-M9): the adopted Python SDK, versioned from the
  # workspace (pyproject dynamic = ["version"] → the crate's
  # version.workspace; sdk001 pins the parity). Trusted publishing (OIDC) —
  # requires the PyPI project configured for GitHub trusted publishing.
  pypi-publish:
    name: Publish Python SDK to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' || (always() && github.event_name == 'push' && needs.github-release.result == 'success') }}
    needs: [github-release, validate-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel + tag-version gate
        run: |
          set -euo pipefail
          pip install -q maturin
          cd crates/sdk/python
          maturin build --release --out dist
          # PR6-009: the tag's version comes from the gate output — on
          # workflow_dispatch GITHUB_REF_NAME is the BRANCH, so the old
          # `GITHUB_REF_NAME#v` rescue path compared the wheel against
          # garbage (or failed a legitimate rescue).
          v="${{ needs.validate-versions.outputs.version }}"
          ls "dist/aikoql-${v}"-*.whl >/dev/null || {
            echo "::error::wheel version does not match tag '${v}' (sdk001 parity)"
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: crates/sdk/python/dist/

  # ── Post-publish identity verification (PR6-009) ────────────────
  # The review's after-block: once a channel has published, it must answer
  # with the tag's version. Runs on the rescue (dispatch) path too — a
  # manual rescue must never silently create a mismatched release. Each
  # check is gated on its channel's job having succeeded; if nothing
  # published, the job passes with a notice (nothing to verify).
  verify-release-identity:
    name: Verify published identity vs tag
    if: ${{ always() }}
    needs: [validate-versions, github-release, npm-publish, pypi-publish, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: npm version == tag
        if: needs.npm-publish.result == 'success'
        env:
          V: ${{ needs.validate-versions.outputs.version }}
        run: |
          set -euo pipefail
          got="$(npm view aikoql-mcp version)"
          [ "$got" = "$V" ] || { echo "::error::npm aikoql-mcp version '$got' != tag '$V'"; exit 1; }
          echo "::notice::npm aikoql-mcp@$got == tag"
      - name: PyPI version == tag
        if: needs.pypi-publish.result == 'success'
        env:
          V: ${{ needs.validate-versions.outputs.version }}
        run: |
          set -euo pipefail
          got="$(curl -fsS https://pypi.org/pypi/aikoql/json | jq -r .info.version)"
          [ "$got" = "$V" ] || { echo "::error::PyPI aikoql version '$got' != tag '$V'"; exit 1; }
          echo "::notice::PyPI aikoql@$got == tag"
      - name: GHCR OCI label == tag
        if: needs.docker-manifest.result == 'success'
        env:
          V: ${{ needs.validate-versions.outputs.version }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/anckursingh/aikoql:${V}" >/dev/null
          got="$(docker inspect "ghcr.io/anckursingh/aikoql:${V}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          [ "$got" = "$V" ] || { echo "::error::GHCR :${V} image label '$got' != tag '$V'"; exit 1; }
          echo "::notice::GHCR :${V} image label == tag"
      - name: GitHub Release == tag
        if: needs.github-release.result == 'success'
        env:
          V: ${{ needs.validate-versions.outputs.version }}
        run: |
          set -euo pipefail
          got="$(gh api "repos/anckursingh/aikoql/releases/tags/v${V}" --jq .tag_name)"
          [ "$got" = "v${V}" ] || { echo "::error::GitHub Release tag '$got' != 'v${V}'"; exit 1; }
          echo "::notice::GitHub Release v${V} == tag"
      - name: Nothing published
        if: ${{ needs.npm-publish.result != 'success' && needs.pypi-publish.result != 'success' && needs.docker-manifest.result != 'success' && needs.github-release.result != 'success' }}
        run: echo "::notice::no channel published — nothing to verify"
