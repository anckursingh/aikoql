# P5-M0 (gd001) — Baseline Certification Guard.
#
# Re-runs the 1M v2 workload and asserts the gate-5 self-regression ratio
# against the committed v2 baseline whenever a protected path changes:
# crates/storage, crates/kernel, crates/compiler, crates/runtime.
#
# Ratio basis (S-03 / gate 5): the committed `result-1m-aikoql-v2.json`.
# The run writes its fresh twin (`-fresh` suffix, AIKOQL_REPORT_FRESH=1
# strict opt-in) so the two artifacts coexist; scripts/gate5-check.py
# computes the ratio. The v1 baseline died with the S-02 decommission.
#
# Wired by the dependency-dag job's gd001 pin (ci.yml): deleting this file,
# dropping a protected path from its triggers, un-arming the 1M regime, or
# re-adding a V2ADOPT_BACKEND=aikoql leg fails CI.

name: Baseline Certification Guard

# CodeQL actions/missing-workflow-permissions: the guard only reads the
# repo and runs benchmarks — no contents: write anywhere.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'crates/storage/**'
      - 'crates/kernel/**'
      - 'crates/compiler/**'
      - 'crates/runtime/**'
      - '.github/workflows/baseline-guard.yml'
      - 'scripts/gate5-check.py'
      - 'scripts/artifact_schema.py'
      - 'scripts/test_artifact_schema.py'
  push:
    branches: [main]
    paths:
      - 'crates/storage/**'
      - 'crates/kernel/**'
      - 'crates/compiler/**'
      - 'crates/runtime/**'
      - '.github/workflows/baseline-guard.yml'
      - 'scripts/gate5-check.py'
      - 'scripts/artifact_schema.py'
      - 'scripts/test_artifact_schema.py'
  workflow_dispatch:

jobs:
  guard:
    name: 1M gate-5 ratio (fresh vs committed v2)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # P5-M47: the checker scripts validate their evidence schema and the
      # artifact freshness stamp — the pins must hold before the gate runs.
      - name: Checker schema pins
        shell: bash
        run: python scripts/test_artifact_schema.py
      - name: Run 1M v2 workload
        shell: bash
        run: |
          export V2ADOPT_NIGHTLY=1m
          export V2ADOPT_BACKEND=aikoql-v2
          export AIKOQL_REPORT_WRITE=1
          export AIKOQL_REPORT_FRESH=1
          cargo test -p aikoql-storage-v2 --release --test kse_m7_v2_workloads
      - name: Gate-5 ratio check
        shell: bash
        run: python scripts/gate5-check.py
      # P5-M47 (R4-P2-07): the fresh artifact IS the next-baseline evidence —
      # always uploaded (a red gate is exactly when the evidence is needed),
      # freshness-stamped by the gate check above. Nothing is committed from
      # CI (P3-M0 rule 6): the maintainer downloads and commits.
      - name: Upload fresh 1M v2 artifact (next-baseline evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-1m-v2
          path: artifacts/storage-engine-v2/result-1m-aikoql-v2-fresh.json
          if-no-files-found: error
