# P5-M0 (gd001) — Baseline Certification Guard.
#
# Re-runs the 1M v2 adoption workload and asserts the gate-5 slow-down ratio
# against the committed v1 baseline whenever a protected path changes:
# crates/storage, crates/kernel, crates/compiler, crates/runtime.
#
# Ratio basis (SE2-M28 / gate 5): the committed `result-1m-aikoql.json` (v1,
# Windows). The ratio is computed by scripts/gate5-check.py — single-backend
# runs leave the harness's own gate verdict null BY DESIGN (the harness only
# judges the full 4-backend matrix), so CI must compute it itself.
#
# Wired by the dependency-dag job's gd001 pin (ci.yml): deleting this file,
# dropping a protected path from its triggers, or un-arming the 1M regime
# fails CI.

name: Baseline Certification Guard

# CodeQL actions/missing-workflow-permissions: the guard only reads the
# repo and runs benchmarks — no contents: write anywhere.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'crates/storage/**'
      - 'crates/kernel/**'
      - 'crates/compiler/**'
      - 'crates/runtime/**'
      - '.github/workflows/baseline-guard.yml'
      - 'scripts/gate5-check.py'
      - 'scripts/artifact_schema.py'
      - 'scripts/test_artifact_schema.py'
  push:
    branches: [main]
    paths:
      - 'crates/storage/**'
      - 'crates/kernel/**'
      - 'crates/compiler/**'
      - 'crates/runtime/**'
      - '.github/workflows/baseline-guard.yml'
      - 'scripts/gate5-check.py'
      - 'scripts/artifact_schema.py'
      - 'scripts/test_artifact_schema.py'
  workflow_dispatch:

jobs:
  guard:
    name: 1M gate-5 ratio (v2 vs v1 baseline)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # P5-M47: the checker scripts validate their evidence schema and the
      # artifact freshness stamp — the pins must hold before the gate runs.
      - name: Checker schema pins
        shell: bash
        run: python scripts/test_artifact_schema.py
      - name: Run 1M v2 workload
        shell: bash
        run: |
          export V2ADOPT_NIGHTLY=1m
          export V2ADOPT_BACKEND=aikoql-v2
          export AIKOQL_REPORT_WRITE=1
          cargo test -p aikoql-storage-v2 --release --test kse_m7_v2_workloads
      - name: Gate-5 ratio check
        shell: bash
        run: python scripts/gate5-check.py
      # P5-M47 (R4-P2-07): the fresh artifact IS the republish evidence —
      # always uploaded (a red gate is exactly when the evidence is needed),
      # freshness-stamped by the gate check above. Nothing is committed from
      # CI (P3-M0 rule 6): the maintainer downloads and commits.
      - name: Upload fresh 1M v2 artifact (republish evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-1m-v2
          path: artifacts/storage-engine-v2/result-1m-aikoql-v2.json
          if-no-files-found: error

  # P5-M47 (R4-P2-07): the committed v1 baseline predates the M37 *_ns
  # rename — its republish regenerates it through the SAME harness
  # (V2ADOPT_BACKEND=aikoql) at the pushed head, freshness-stamps the
  # upload, and hands it to the maintainer to commit. Push/manual only:
  # a 1M v1 leg on every PR would double the guard's cost for no
  # PR-time purpose.
  republish:
    name: 1M v1 baseline republish (M37 *_ns schema)
    runs-on: windows-latest
    timeout-minutes: 360
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 1M v1 workload
        shell: bash
        run: |
          export V2ADOPT_NIGHTLY=1m
          export V2ADOPT_BACKEND=aikoql
          export AIKOQL_REPORT_WRITE=1
          cargo test -p aikoql-storage-v2 --release --test kse_m7_v2_workloads
      - name: Freshness-stamp the upload
        shell: bash
        run: python scripts/artifact_schema.py artifacts/storage-engine-v2/result-1m-aikoql.json
      - name: Upload fresh 1M v1 artifact (republish evidence)
        uses: actions/upload-artifact@v4
        with:
          name: fresh-1m-v1
          path: artifacts/storage-engine-v2/result-1m-aikoql.json
          if-no-files-found: error
