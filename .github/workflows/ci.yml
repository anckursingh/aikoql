name: CI

on:
  push:
    branches: [master, main, cross-db-support]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# CodeQL actions/missing-workflow-permissions: CI only reads the repo.
permissions:
  contents: read

jobs:
  check:
    name: Check + Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo check --workspace
      # Per-push CI is the fast regression net — every unit test plus the
      # fast integration tests. Skip classification (PR#2 review SE-06):
      # every test capable of finding data loss, wrong reads, wrong
      # ordering, corruption or recovery failure runs a REDUCED
      # DETERMINISTIC PR version here; only pure measurement stays
      # scheduled (weekly release smoke in benchmark.yml + the
      # nightly env at local milestones).
      #
      # | Test                             | Correctness | Performance | Resource | Certification (full version)       |
      # |----------------------------------|:-----------:|:-----------:|:--------:|------------------------------------|
      # | merged_iterator_correctness      | byte-exact vs oracle | — | — | SE2M12_NIGHTLY=1 (50k steps) |
      # | w31_scale_001                    | probe success 12/12 per scale | cells | 10K synthesis | W31_SCALE_NIGHTLY=1 (100k) |
      # | w31_scale_002                    | probe pins (n=1000 fixed) | cells | — | runs fully on PR |
      # | v2_m7_workloads (SKIPPED)        | verdict is STORAGE_REGRESSION-gated; v2 nets = the 40+ reduced SE2 suites | cells | RSS/disk cells | STORAGE_REGRESSION=1 (100k) at milestones |
      # | multimodal_golden/retrieval_quality/semantic_extraction_quality (SKIPPED here) | re-run with --nocapture in dedicated steps below — zero coverage loss | quality metrics | — | the dedicated steps |
      # | load_encryption_overhead_v2 (SKIPPED) | — | pure measurement | — | weekly --ignored release (also #[ignore] in debug) |
      # | sfm009_large_wal_snapshot_has_bounded_rss (SKIPPED here) | bounded-RSS correctness (proven locally; RED archived) | — | whole-process RSS cell | local suite |
      #
      # 2026-09-07 re-classification (evidence: run 34088188509): the step
      # timed out at 60 min — test-profile compile 13m26s inside the step,
      # tests still running at the kill (aikoql-storage 28 min incl.
      # m7_workloads 17; v2_m7_workloads 11+; the Windows runner is 4-7x
      # the dev box on fsync-heavy tests). Per the rule above the
      # next-slowest tests moved to the skip list — the budget is NOT
      # raised. Remaining measured cost: ~30 min tests + ~14 min compile.
      # sfm009_large_wal_snapshot_has_bounded_rss (PR6-R3-003) is skipped
      # like kse19: a whole-process RSS cell, sibling tests in the same
      # binary perturb the peak on CI runners — it stays in the local suite
      # (RED 192700 KiB growth → GREEN bounded, both proven locally).
      # The skip list is derived from tests/gated.toml via
      # scripts/skip-list.sh — the registry is the single source of truth
      # (PR6-F2 / P0-2); scripts/check-skip-drift.sh guards the wiring.
      - run: cargo test --workspace -- $(bash scripts/skip-list.sh)
        # bash, not the pwsh default: the $(...) here is bash word-splitting.
        # pwsh captures a native command's one-line output as ONE argument —
        # the Windows check job died on "Unrecognized option: 'skip
        # load_encryption_overhead --skip …'" (CI rounds 2-3; masked until
        # round 1's clippy/hang classes cleared, and untested on Windows
        # since the registry landed after the last green Windows run). The
        # command was authored for bash; the Linux job runs it under bash.
        shell: bash
        timeout-minutes: 60
      # DoD 19 (HLD §52/§53): golden PDF suite with visible per-stage
      # metrics — extraction/fragmentation/semantic/provenance/retrieval.
      - run: cargo test -p aikoql-ingestion --test multimodal_golden -- --nocapture
      # PR-G (HLD §60): rule-baseline retrieval-quality matrix
      # (Recall@K/MRR/NDCG) — the pinned baseline future analyzer variants
      # are compared against.
      - run: cargo test -p aikoql-ingestion --test retrieval_quality -- --nocapture
      # PR-Q (HLD §53/§60): semantic-extraction quality — entity/relation
      # precision/recall + fact accuracy over the golden suite, judged
      # against hand-authored ground truth. The last two §60 decision
      # metrics (fact + relation extraction quality) now have instruments.
      - run: cargo test -p aikoql-ingestion --test semantic_extraction_quality -- --nocapture

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      # sfm009_large_wal_snapshot_has_bounded_rss (PR6-R3-003): same RSS-cell
      # gating as the Windows job — local-suite test, skipped on CI runners.
      # Skip list derived from tests/gated.toml (PR6-F2 / P0-2).
      - run: cargo test --workspace -- $(bash scripts/skip-list.sh)
        # Fast regression net. Only pure measurement is skipped (SE-06
        # classification — the same skip list as the Windows check job's
        # table, so the regression net is identical on both OSes); every
        # correctness-capable suite runs its reduced deterministic PR
        # version here. The full suite used to run 14-16 min on the
        # 2-core runner; the correctness suites add ~3-5 min back in
        # debug — the budget stays 30. R4-P2-06: the M47 push's timeout
        # was a csc002 park-leak hang (env armed by a parallel sibling,
        # marker in the wrong dir, nobody deletes it — fixed by
        # serializing the whole binary), NOT a budget overflow; the suite
        # had streamed to its midpoint when the hang started.
        timeout-minutes: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  plugin:
    name: Plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node npm-publish/validate-plugin.js

  docker:
    name: Docker build + health (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aikoql:test .
      - run: docker run --rm aikoql:test --version
      - name: Start container and wait for healthy
        run: |
          docker run -d --name aikoql-test -e AIKOQL_TCP_TOKEN=ci:ci:admin aikoql:test
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' aikoql-test)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy — last logs:"
          docker logs aikoql-test 2>&1 | tail -30
          exit 1
      # R1/R3 (review round 3): a non-loopback bind must fail closed — the
      # image default binds 127.0.0.1; this asserts the guard, not just the
      # default.
      - name: R1 fail-closed — non-loopback --listen is rejected
        run: |
          set +e
          out=$(docker run --rm --entrypoint aikoql -e AIKOQL_TCP_TOKEN=ci:ci:admin \
            aikoql:test serve /data/aikoql.redb --listen 0.0.0.0:9090 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 2 ] || { echo "expected exit 2, got $rc"; exit 1; }
          echo "$out" | grep -q "non-loopback"
      # MVP-DEP-003 (TESTING-PLAN §9.4 item 10): volume-backed restart
      # preserves knowledge — container A writes a KO on a named volume,
      # container B (fresh container, same volume) resolves the same KOID
      # with the same content. Asserts the /data container contract.
      - name: DEP-003 — volume-backed restart preserves knowledge
        run: node scripts/e2e-volume-restart.js

  build-release:
    name: Build Release (Linux)
    runs-on: ubuntu-latest
    needs: [check, test-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aikoql-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: aikoql-linux
          path: target/release/aikoql-mcp

  # R7 (review round 3): the npm tarball was never smoke-tested in CI — pack
  # it, install it into a clean prefix, and drive a full MCP round-trip
  # through the wrapper. AIKOQL_BINARY makes the wrapper run the artifact
  # built by build-release instead of downloading a GitHub Release that does
  # not exist yet for a PR's version.
  npm-tarball-smoke:
    name: npm tarball smoke (Linux)
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: aikoql-linux
          path: bin
      - name: Pack, clean install, MCP round-trip
        run: |
          set -euo pipefail
          chmod +x bin/aikoql-mcp
          export AIKOQL_BINARY="$GITHUB_WORKSPACE/bin/aikoql-mcp"
          tarball=$(cd npm-publish && npm pack --silent)
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/npm-publish/$tarball" --no-audit --no-fund >/dev/null
          "$tmp/node_modules/.bin/aikoql-mcp" --version
          node "$GITHUB_WORKSPACE/npm-publish/smoke-mcp.js" "$tmp/node_modules/.bin/aikoql-mcp"

  # E2E dogfood gate (reviewer MVP gate): ingest the checked-out repo, answer
  # the 10 continuity questions over the real MCP surface, then RESTART the
  # server on the same db and assert the data survives — the six-item gate
  # (Install → Start → Ingest → Search → Retrieve → Restart → Data survives)
  # runs on every CI, not just manually before a release.
  e2e-dogfood:
    name: E2E dogfood — ingest, query, restart (Linux)
    runs-on: ubuntu-latest
    needs: build-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: aikoql-linux
          path: bin
      - name: Ingest → dogfood → restart
        run: |
          set -euo pipefail
          chmod +x bin/aikoql-mcp
          DB=dogfood.redb
          # crates/ yields the Struct entities the gate asserts, without
          # pulling build artifacts into the corpus. No model is installed
          # here — ingestion degrades to lexical (PRR-3, no downloads).
          # ingest-dir prints "  KOID: <hex>" on stdout; awk '{print $3}' is
          # empty on that line ($1="KOID:", $2=<hex>) — extract by pattern.
          KOID=$(bin/aikoql-mcp ingest-dir crates "$DB" | sed -n 's/^ *KOID: *//p' | head -1)
          [ -n "$KOID" ] || { echo "ingest-dir printed no KOID"; exit 1; }
          node scripts/e2e-dogfood.js bin/aikoql-mcp "$DB" "$KOID"
          node scripts/e2e-restart.js bin/aikoql-mcp "$DB"

  # MVP-QA-001 GATE-04 (§9.3 decision: connectors ARE in MVP scope): the
  # connector certification suite runs against real databases as GitHub
  # Actions services — the testcontainers equivalent in CI. The tests
  # env-gate (AIKOQL_TEST_* set here; unset → skip with notice), so the
  # Windows check job stays green without services.
  connectors:
    name: Connector certification — live pg/pgvector/mongo/neo4j
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aikoql
          POSTGRES_PASSWORD: aikoql-ci
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aikoql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit()'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/aikoql-ci
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p aikoql-ci 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aikoql-mcp --test connector_certification -- --nocapture
        env:
          AIKOQL_TEST_PG_DSN: host=localhost port=5432 user=aikoql password=aikoql-ci dbname=knowledge
          AIKOQL_TEST_PGVECTOR_DSN: host=localhost port=5432 user=aikoql password=aikoql-ci dbname=knowledge
          AIKOQL_TEST_MONGO_URI: mongodb://localhost:27017
          AIKOQL_TEST_MONGO_DB: knowledge
          AIKOQL_TEST_NEO4J_URI: http://localhost:7474
          AIKOQL_TEST_NEO4J_USER: neo4j
          AIKOQL_TEST_NEO4J_PASSWORD: aikoql-ci

  # MVP-QA-001 §23: certification artifacts must always match the §9.1
  # registry — --self-test pins the decision logic, --check regenerates and
  # fails on stale artifacts (e.g. a registry edit without re-running the
  # runner). The gate stays NO-GO while connector rows are open (§9.3
  # decision: connectors are in MVP scope — this job asserts the artifacts
  # say so).
  certification-artifacts:
    name: Certification artifacts (§23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/certify.js --self-test
      - run: node scripts/certify.js --check

  # P3-M9: the Python SDK is the adopted first-party SDK — its contract
  # suite (sdk001 version parity + 8 mcp_client tests against the real
  # binary) runs in CI so the client can never drift from the server again
  # (the P3-M1 token-auth drift that broke all 8 tests was caught here).
  python-sdk:
    name: Python SDK contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build server binary (the contract target)
        run: cargo build -p aikoql-mcp
      - name: Build native module + run SDK suite
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -q maturin pytest
          export VIRTUAL_ENV="$PWD/.venv"
          cd crates/sdk/python
          "$VIRTUAL_ENV/bin/maturin" develop --release
          "$VIRTUAL_ENV/bin/python" -m pytest tests/ -q

  # PR6-F6 (P1-6) → CI-03 (the review's §16 trap): the per-commit perf
  # smoke folded into ci.yml. An always-run job with a fast exit on
  # non-matching paths — a path-gated required workflow skips and a
  # required skipped check pends forever, so the gate must run and decide.
  # W1–W5 point lookup / write throughput / scan / hot-cache / small
  # compaction vs the committed baseline at a 3x budget — 8x for the
  # fsync-heavy write/compact wall cells (shared Windows runners run
  # 4-7x the laptop on fsync; run 36099891181 measured 4.11x)
  # (scripts/perf-smoke-check.py), plus the self-asserting recall cell.
  perf-smoke:
    name: Perf smoke (W1–W5, 3x budget)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fast exit — no smoke path changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && \
             git fetch --depth=1 origin "$base" >/dev/null 2>&1; then
            if ! git diff --name-only "$base...HEAD" | grep -qE '^crates/storage/|^crates/kernel/|^crates/engines/vector/|^scripts/perf-smoke|^scripts/artifact_schema\.py|^scripts/test_artifact_schema\.py|^artifacts/storage-engine-v2/perf-smoke-baseline\.json'; then
              echo "no perf-smoke path changed — fast exit"
              exit 0
            fi
          fi
          echo "perf-smoke path changed — running the full smoke"
      - uses: dtolnay/rust-toolchain@stable
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      # P5-M47: the checker scripts validate their evidence schema and the
      # artifact freshness stamp — the pins must hold before the gate runs.
      - name: Checker schema pins
        shell: bash
        run: python scripts/test_artifact_schema.py
      - name: Perf smoke cells + budget check
        shell: bash
        run: bash scripts/perf-smoke.sh

  # PR6-F7 (P1-7) → CI-03: the codec/replay coverage floor folded into
  # ci.yml with the same fast-exit shape. The next "it round-trips but
  # nobody asserts it" shows up RED: checkpoint.rs / snapshot.rs / wal.rs
  # must hold their committed line-coverage baseline on every
  # storage-touching change.
  coverage-floor:
    name: Coverage floor (codec/replay)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fast exit — no storage path changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && \
             git fetch --depth=1 origin "$base" >/dev/null 2>&1; then
            if ! git diff --name-only "$base...HEAD" | grep -qE '^crates/storage/|^scripts/check-coverage-floor\.sh|^artifacts/coverage/coverage-baseline\.json'; then
              echo "no coverage-floor path changed — fast exit"
              exit 0
            fi
          fi
          echo "coverage-floor path changed — running the floor check"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # CI-05: cargo cache in every build job (default key = OS + rust
      # version + Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage floor check
        shell: bash
        run: bash scripts/check-coverage-floor.sh

  dependency-dag:
    name: Verify Dependency DAG
    runs-on: ubuntu-latest
    steps:
      # Full history: the R3-005 stamp gate and the P1-8 compiled-head
      # grep walk the doc's commit chain — on the shallow PR merge-ref
      # checkout (the default depth 1) the merge commit masquerades as
      # the doc's last modifier (R3-005 passes vacuously) and
      # `rev-parse DOC_COMMIT^` errors outright (F8 dies with a fatal).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check banned dependencies
        run: |
          echo "Checking banned dependency patterns..."
          if grep -r 'aikoql-kernel.*path.*runtime\|aikoql-kernel.*path.*compiler' crates/*/Cargo.toml crates/*/*/Cargo.toml 2>/dev/null; then
            echo "DAG VIOLATION: kernel must not depend on runtime/compiler"
            exit 1
          fi
          # PR6-R3-005: the dispositions doc must be stamped at the reviewed
          # tip — its evidence is verified at a specific head, and any
          # change that moves the tip must re-stamp it in the same change
          # (RED proven against origin/main and against the pre-stamp branch
          # head through the same script).
          echo "Checking dispositions doc stamped at head..."
          bash scripts/check-disposition-head.sh
          # PR6-F1 (P0-1): every red-archive artifact must be a complete
          # RED — manifest fields + a non-zero exit marker in the log
          # (docs/ARCHITECT-REVIEW-2026-09.md).
          echo "Checking red-archive artifacts..."
          bash scripts/check-red-archives.sh
          # PR6-F2 (P0-2): the gated-cell registry must be the only skip
          # source and every registered name must exist in the tree.
          echo "Checking gated-cell registry..."
          bash scripts/check-skip-drift.sh
          # PR6-F4 (P1-4): test env hygiene + seed determinism — new test
          # code may not mutate the process-global environment (the
          # 2026-09-18 AIKOQL_BACKEND parallel-child leak class) nor use
          # an unseeded RNG; the 10 existing sites are pinned in the
          # script's allowlist (file|token) with honest per-entry reasons.
          echo "Checking test env hygiene + seed determinism..."
          bash scripts/check-test-env-hygiene.sh
          # PR6-F5 (P1-5): the nightly shuffle run + its residue sweepers
          # must stay wired in benchmark.yml (a workflow step can
          # rot silently in a bad merge).
          echo "Checking shuffle-run wiring..."
          bash scripts/check-shuffle-wiring.sh
          # P5-M0 (gd001): the baseline-certification guard
          # (.github/workflows/benchmark.yml's guard job, CI-02) must stay
          # wired — it runs
          # the 1M v2 workload + gate-5 ratio on every change touching a
          # protected path (storage/kernel/compiler/runtime).
          echo "Checking P5-M0 benchmark.yml guard wiring..."
          GUARD=.github/workflows/benchmark.yml
          if [ ! -f "$GUARD" ]; then
            echo "DAG VIOLATION: $GUARD missing — the gate-5 baseline guard job must exist"
            exit 1
          fi
          for path in crates/storage crates/kernel crates/compiler crates/runtime; do
            if ! grep -q "$path" "$GUARD"; then
              echo "DAG VIOLATION: $GUARD must trigger on $path"
              exit 1
            fi
          done
          if ! grep -q 'STORAGE_REGRESSION=1m' "$GUARD"; then
            echo "DAG VIOLATION: $GUARD must run the 1M regime (STORAGE_REGRESSION=1m)"
            exit 1
          fi
          # S-03: the guard compares the fresh run against the committed v2
          # baseline — the FRESH arm must stay armed, and the dead v1
          # republish leg (STORAGE_BACKEND=aikoql) must stay deleted.
          if ! grep -q 'AIKOQL_REPORT_FRESH=1' "$GUARD"; then
            echo "DAG VIOLATION: $GUARD must arm AIKOQL_REPORT_FRESH=1 (the fresh twin)"
            exit 1
          fi
          if grep -q 'STORAGE_BACKEND=aikoql$' "$GUARD"; then
            echo "DAG VIOLATION: $GUARD must not run a v1 backend leg (decommissioned in S-02)"
            exit 1
          fi
          # P5-M47: the gate's checker schema pins must run in the guard,
          # and the fresh artifact must be uploaded (the next-baseline
          # evidence) — either step can rot silently in a bad merge.
          if ! grep -q 'test_artifact_schema.py' "$GUARD"; then
            echo "DAG VIOLATION: $GUARD must run the checker schema pins"
            exit 1
          fi
          if ! grep -q 'upload-artifact' "$GUARD"; then
            echo "DAG VIOLATION: $GUARD must upload the fresh 1M artifact (the next-baseline evidence)"
            exit 1
          fi
          # PR6-F6 (P1-6) → CI-03: the per-commit perf smoke is now a
          # ci.yml job (fast exit on non-matching paths, the review's §16
          # trap — a path-gated required workflow pends forever). The
          # cheap gate-5 catches O(n^2)-class storage regressions at
          # commit time instead of in the nightly 1M guard.
          echo "Checking perf-smoke wiring..."
          SMOKE=.github/workflows/ci.yml
          if ! grep -qE '^  perf-smoke:' "$SMOKE"; then
            echo "DAG VIOLATION: ci.yml must carry the perf-smoke job"
            exit 1
          fi
          # CI-03: the fast exit IS the trigger — the path set must stay.
          if ! grep -q "crates/storage" "$SMOKE" || ! grep -q 'git diff --name-only' "$SMOKE"; then
            echo "DAG VIOLATION: the perf-smoke fast exit must diff against the base and watch crates/storage"
            exit 1
          fi
          if ! grep -q 'perf-smoke.sh' "$SMOKE"; then
            echo "DAG VIOLATION: the perf-smoke job must run scripts/perf-smoke.sh"
            exit 1
          fi
          # P5-M47: the smoke checker's schema pins must run there too.
          if ! grep -q 'test_artifact_schema.py' "$SMOKE"; then
            echo "DAG VIOLATION: the perf-smoke job must run the checker schema pins"
            exit 1
          fi
          # PR6-F7 (P1-7) → CI-03: the codec/replay coverage floor is now
          # a ci.yml job with the same fast-exit shape — a deleted gate
          # lets coverage silently regress.
          echo "Checking coverage-floor wiring..."
          if ! grep -qE '^  coverage-floor:' "$SMOKE"; then
            echo "DAG VIOLATION: ci.yml must carry the coverage-floor job"
            exit 1
          fi
          if ! grep -q 'check-coverage-floor.sh' "$SMOKE"; then
            echo "DAG VIOLATION: the coverage-floor job must run scripts/check-coverage-floor.sh"
            exit 1
          fi
          # PR6-F8 (P1-8): the dogfood review loop must stay wired — the
          # script must exist, and the doc's compiled section must have
          # been emitted at the base of the commit that last modified the
          # doc: a doc change without a re-emit leaves compiled-head
          # behind and fails here (the R3-005 staleness rule extended
          # from the stamp to the compiled section). Clean doc-touching
          # merges simplify through to the branch head, so their base is
          # the emit commit.
          echo "Checking dogfood review-loop wiring..."
          DOGFOOD=scripts/dogfood-review-loop.py
          if [ ! -f "$DOGFOOD" ]; then
            echo "DAG VIOLATION: $DOGFOOD missing — the P1-8 review loop must exist"
            exit 1
          fi
          DOC_COMMIT=$(git log -1 --format=%H -- docs/PR6-TDD-DISPOSITIONS.md)
          DOC_BASE=$(git rev-parse "$DOC_COMMIT^")
          if ! grep -q "^compiled-head: $DOC_BASE$" docs/PR6-TDD-DISPOSITIONS.md; then
            echo "DAG VIOLATION: the dogfood compiled section is stale — re-run scripts/dogfood-review-loop.py full"
            exit 1
          fi
          # CI-04: the architecture hygiene gate (S-01 storage legs +
          # CI-01 workflow legs + the S-04 language leg) joins the dag —
          # the job asserts the ARCHITECTURE, not deleted-file history
          # (the P3-M0/P3-M9/R2-012 historical pins were deleted here).
          echo "Checking architecture hygiene (storage + workflow legs)..."
          bash scripts/check-architecture-hygiene.sh
          echo "Dependency DAG OK"
