[package]
name = "aikoql-benchmarks"
description = "aikoql benchmark harness — load tests and micro-benchmarks. Gates releases on published thresholds."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aikoql-compiler = { path = "../crates/compiler" }
aikoql-graph = { path = "../crates/engines/graph" }
aikoql-kernel = { path = "../crates/kernel" }
aikoql-runtime = { path = "../crates/runtime" }
aikoql-vector = { path = "../crates/engines/vector" }
aikoql-scheduler = { path = "../crates/engines/scheduler" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hybrid_recall"
harness = false

[[bench]]
name = "knowledge_ops"
harness = false

[[bench]]
name = "scale"
harness = false
