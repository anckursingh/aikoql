# cargo audit's ignore list, read by scripts/check-advisories.sh for every
# lockfile. Each entry: why the advisory cannot reach aikoql, and the
# trigger that removes it. Review on every candle / tantivy upgrade.
[advisories]
ignore = [
  # zip 7.2.0, pulled by candle-core 0.9.2 (the embedding model runtime).
  # All three are about ZipArchive::extract / ZipStreamReader::extract
  # writing an archive to disk (symlinks, SUID/SGID bits, permissions):
  # candle never extracts — it reads .pth/.npz archives in memory — and
  # aikoql loads its model only from safetensors (config.json,
  # tokenizer.json, model.safetensors), never through candle's zip path.
  # Remove when candle-core depends on zip >= 9 (0.11.0 still needs ^8.6).
  "RUSTSEC-2026-0367", # SUID/SGID bits preserved during extraction
  "RUSTSEC-2026-0368", # extract() creates symlinks pointing outside the destination
  "RUSTSEC-2026-0369", # extract() applies permissions through symlinks
]
