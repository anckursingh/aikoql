# Mnemosyne Configuration
# Copy this file to where you run mnemosyne-mcp, or override values via CLI flags.
# CLI flags always take precedence over this config file.

[storage]
# Storage backend: "redb" (default) or "rocksdb" (requires --features storage-rocksdb).
# redb: pure Rust, single-writer, ideal for development and single-agent workloads.
# rocksdb: C++ LSM-tree, concurrent readers+writers, better for production workloads.
backend = "redb"
# Path to the database directory (redb uses a single file, rocksdb uses a directory).
path = "./mnemosyne_data"

[database]
# Deprecated: use [storage] section above. Kept for backward compatibility.
# Path to the redb database file. Default: ./mnemosyne.redb
path = "./mnemosyne.redb"

[server]
# TCP listen address. Comment out for stdio mode (single client).
# listen = "127.0.0.1:9090"

# Prometheus metrics + health check HTTP endpoint. Comment out to disable.
# metrics_addr = "127.0.0.1:9091"

[encryption]
# Enable encryption at rest (MRFC-0020). Requires a key file.
# Set to true and provide a key_path to enable.
enabled = false

# Path to the master key file for the LocalKMS.
# key_path = "./mnemosyne.key"

# Passphrase for the LocalKMS key derivation (or set MNEMOSYNE_PASSPHRASE env var).
# passphrase = "change-me-in-production"

[rate_limit]
# Enable per-process rate limiting for MCP tool calls.
enabled = true
# Maximum tool calls per minute per connection.
max_calls_per_minute = 120
# NOTE: Process-local. In a horizontally-scaled deployment (load balancer →
# N instances), each instance independently allows max_calls_per_minute.
# For global rate limiting, use a shared backend (see rate_limiter.rs) or
# enforce limits at the gateway layer.

[embedding]
# Embedding provider for MATCH ... USING EMBEDDING queries.
# "openai" (OpenAI-compatible: Ollama, OpenAI, etc.) — uses /v1/embeddings.
# "candle" (local BERT inference via candle-transformers) — no network, CPU only.
provider = "openai"
# Base URL for OpenAI-compatible endpoint (omit /v1; default: Ollama localhost).
base_url = "http://localhost:11434"
# Model name for the embedding endpoint.
model = "nomic-embed-text"
# API key for remote services (omit for Ollama — no auth needed).
# api_key = "sk-..."

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log format: text, json
format = "text"
