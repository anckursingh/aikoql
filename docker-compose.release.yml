# PRODUCTION compose: runs the released multi-arch GHCR image — no local
# build (docker-compose.yml is the development variant with `build: .`).
#
#   AIKOQL_VERSION=0.2.1 AIKOQL_TCP_TOKEN=TOKEN::admin docker compose -f docker-compose.release.yml up -d
#
# TCP auth is fail-closed (PRR-2): the container refuses to listen without a
# token, so AIKOQL_TCP_TOKEN (TOKEN[:TENANT[:ROLE1,ROLE2]]) is required here.
# Supply it from a secret manager in production, not a committed .env.
# Pin AIKOQL_VERSION to an immutable release tag; `latest` is for trying out.
# The container's TCP/metrics listeners are loopback-only (R1/R3 — the server
# rejects non-loopback binds), so this file publishes NO host ports (CI-11):
# `up -d` runs a healthy container, and host clients reach it over stdio
# (`docker run -i`) or via a sidecar sharing the network namespace.
services:
  aikoql:
    image: ghcr.io/anckursingh/aikoql:${AIKOQL_VERSION:-latest}
    environment:
      AIKOQL_TCP_TOKEN: ${AIKOQL_TCP_TOKEN:?set a TCP token (TOKEN[:TENANT[:ROLES]])}
    volumes:
      - aikoql_data:/data
    restart: unless-stopped
    # The image ships its own HEALTHCHECK (GET /health on :9091).

volumes:
  aikoql_data:
